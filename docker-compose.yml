services:
  garmin-dawarich-sync:
    build: .
    container_name: garmin-dawarich-sync
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # SERVER_ENABLED: "false"
      PORT: 8080
      DATA_DIR: /data
      TMP_DIR: /tmp/garmin-dawarich
      # Garmin: 10 activities per page
      BATCH_SIZE: 10
      # Delay between Garmin requests/downloads. Increase if desired.
      REQUEST_DELAY_MS: 5000
      # Delay between Dawarich uploads.
      DAWARICH_DELAY_MS: 3000
      # Daily sync time is controlled by the in-process scheduler.
      SYNC_HOUR: 3
      SYNC_MINUTE: 17
    volumes:
      - ./data:/data
